name: CI

on:
  pull_request:
  push:
    branches: [master, plan-1-foundation]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

      - name: Build
        # next/font 向 Google 抓字型偶發失敗（重跑即過）；只針對這個錯誤重試，最多 3 次。
        # 其他建置錯誤照舊立刻失敗。
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npm run build 2>&1 | tee build.log; then
              exit 0
            fi
            if ! grep -q 'An error occurred in `next/font`' build.log; then
              echo "建置失敗，且不是 next/font 抓字型的問題，不重試。"
              exit 1
            fi
            echo "::warning::第 ${attempt} 次建置因 next/font 抓字型失敗"
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "連續 3 次都因 next/font 失敗。"
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CRON_SECRET: dummy
